<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Handwriting Canvas - Dark Mode</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .right-strip {
      width: 42px;
      height: 100%;
      background-color: #dc2626;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      flex-shrink: 0;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      border-left: 1px solid #09090b;
    }
    .right-strip:active {
      background-color: #991b1b;
    }
    canvas {
      flex: 1;
      width: 100%;
      touch-action: none;
      cursor: crosshair;
      background: #18181b;
    }
    .bottom-strip {
      height: 70px;
      width: 100%;
      background-color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-top: 1px solid #27272a;
    }
    .clear-btn {
      width: 100%;
      max-width: 400px;
      height: 100%;
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .clear-btn:active {
      background-color: #991b1b;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="main-content">
      <canvas id="canvas"></canvas>

      <div class="bottom-strip">
        <button class="clear-btn" id="bottomClearBtn">Start Over / Clear</button>
      </div>
    </div>
    
    <div class="right-strip" id="rightClearBtn">CLEAR</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bottomClearBtn = document.getElementById('bottomClearBtn');
    const rightClearBtn = document.getElementById('rightClearBtn');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isDrawing = false;

    function startDrawing(e) {
      isDrawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    function clearCanvas(e) {
      if (e) e.preventDefault();
      isDrawing = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
    }

    [bottomClearBtn, rightClearBtn].forEach(btn => {
      btn.addEventListener('pointerdown', clearCanvas);
      btn.addEventListener('click', clearCanvas);
    });
  </script>
</body>
</html>
